<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>ChronoCraft - Personal Customized Productivity Workspace</title>
    <meta
      name="description"
      content="An interconnected offline-first personal productivity workspace featuring Focus, Timeline, Notes, Events, Habits, and Lists."
    />
    <meta
      property="og:title"
      content="ChronoCraft - Personal Customized Productivity Workspace"
    />
    <meta
      property="og:description"
      content="An interconnected offline-first personal productivity workspace featuring Focus, Timeline, Notes, Events, Habits, and Lists."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon (browser tab) -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512.png"
    />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS home screen -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ChronoCraft" />

    <!-- Android / Chrome URL bar tint -->
    <meta name="theme-color" content="#0B0F17" />
  </head>
  <body
    class="bg-slate-50 text-slate-900 dark:bg-[#0B0F17] dark:text-slate-100 antialiased min-h-screen selection:bg-indigo-500/30 selection:text-indigo-400"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
